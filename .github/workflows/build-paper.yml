# Runs on every push: first checks that the results files look right, then builds the paper PDF.
# When I tag a version (like v1.0), the PDF also gets attached to a GitHub release.
name: Build paper

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the PDF to a release

jobs:
  checks:
    name: Check notebooks and results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analysis/check_outputs.py

  paper:
    name: Compile LaTeX
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/latex
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/latex/main.pdf
      - name: Attach PDF to release (tagged versions only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: paper/latex/main.pdf
